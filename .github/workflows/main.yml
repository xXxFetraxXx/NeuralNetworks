name: Build & Deploy All

on:
  push:
    branches:
      - main

jobs:

  # Lit les flags __update_doc__ et __update_package__ définis dans
  # src/NeuralNetworks/__init__.py et les expose aux autres jobs.
  read_flags:
    runs-on: ubuntu-latest
    outputs:
      update_doc: ${{ steps.flags.outputs.update_doc }}
      update_package: ${{ steps.flags.outputs.update_package }}
    steps:
      - uses: actions/checkout@v3
      - id: flags
        run: |
          echo "update_doc=$(grep -E '^__update_doc__' src/NeuralNetworks/__init__.py | sed -E 's/.*=[[:space:]]*//' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "update_package=$(grep -E '^__update_package__' src/NeuralNetworks/__init__.py | sed -E 's/.*=[[:space:]]*//' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  mkdocs_deploy:
    needs: read_flags
    if: needs.read_flags.outputs.update_doc == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - run: python -m pip install --upgrade pip
      - run: pip install mkdocs mkdocs-material mkdocstrings
      - run: pip install mkdocstrings[python]

      - name: Build MkDocs site
        run: mkdocs build -f docs/mkdocs.yml

      - name: Deploy MkDocs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /home/runner/work/NeuralNetworks/NeuralNetworks/docs/site

  # needs: read_flags (et plus mkdocs_deploy) car un job skippé dans "needs"
  # ferait aussi skip ce job, même si __update_package__ = True
  python_publish:
    needs: read_flags
    if: needs.read_flags.outputs.update_package == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build the package
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*